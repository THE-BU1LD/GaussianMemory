name: GaussianMemory CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gaussian-memory-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile maintained sources
        run: python -m compileall -q src train.py eval.py tests

      - name: Run tests
        run: pytest -q tests

      - name: Smoke train/eval entry points
        run: |
          python train.py --help
          python eval.py --help

      - name: Evidence-boundary sentinel
        run: |
          test -s RESEARCH_TRUTH.md
          grep -q "illustrative" RESEARCH_TRUTH.md
          grep -q "Do not" RESEARCH_TRUTH.md
